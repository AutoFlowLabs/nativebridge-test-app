name: Release with Sessionless Appium Test

# This workflow supports TWO modes:
#
# Mode 1: UPLOAD + TEST (default)
#   - Leave 'app_id' empty
#   - Workflow uploads APK to NativeBridge
#   - Extracts app_id from response
#   - Runs sessionless Appium test
#
# Mode 2: TEST ONLY (quick mode)
#   - Provide 'app_id' parameter (e.g., "HgWp")
#   - Workflow SKIPS upload step
#   - Directly runs sessionless Appium test with provided app_id
#   - Useful for testing existing apps without re-uploading
#
# Both modes use sessionless execution:
#   - Auto-creates device session
#   - Installs and launches app
#   - Runs tests
#   - Auto-deletes session (no cleanup needed!)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID (optional - if provided, skips upload step)'
        required: false
        default: ''
      version:
        description: 'Version number (required only if uploading APK)'
        required: false
        default: '1.0.0-test'
      device_name:
        description: 'Device name (exact model name from dashboard)'
        required: true
        default: 'Samsung Galaxy S22 Ultra'
      region:
        description: 'Region (ind, usa, etc.)'
        required: false
        default: 'ind'

env:
  DEFAULT_REGION: 'ind'

jobs:
  # ============================================================================
  # Upload APK Only (No Session Creation)
  # Skipped if app_id is provided as input parameter
  # ============================================================================
  upload-apk:
    name: Upload APK to NativeBridge
    runs-on: ubuntu-latest
    if: github.event.inputs.app_id == ''
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      app_id: ${{ steps.upload_apk.outputs.app_id }}
      magic_link: ${{ steps.upload_apk.outputs.magic_link }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Version
        id: get_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare APK
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p release-artifacts

          if [ ! -f "builds/NativeBridge-Production.apk" ]; then
            echo "❌ ERROR: APK not found at builds/NativeBridge-Production.apk"
            exit 1
          fi

          cp builds/NativeBridge-Production.apk \
             release-artifacts/NativeBridge-v${VERSION}.apk

          FILE_SIZE=$(ls -lh release-artifacts/NativeBridge-v${VERSION}.apk | awk '{print $5}')
          echo "✓ Production APK ready: $FILE_SIZE"
          echo "APK_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeBridge-Android-v${{ steps.get_version.outputs.VERSION }}
          path: release-artifacts/NativeBridge-v${{ steps.get_version.outputs.VERSION }}.apk
          retention-days: 90

      # ========================================================================
      # Upload APK to NativeBridge (No session creation)
      # This uses the file upload API to get magic link and app ID
      # ========================================================================
      - name: Upload APK to NativeBridge
        id: upload_apk
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          APK_PATH="release-artifacts/NativeBridge-v${VERSION}.apk"

          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "❌ ERROR: NATIVEBRIDGE_API_KEY not configured"
            exit 1
          fi

          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Uploading APK to NativeBridge                  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  APK: $APK_PATH"
          echo "  Region: ${{ github.event.inputs.region || env.DEFAULT_REGION }}"
          echo ""

          # Upload APK using the /v1/application API
          echo "Uploading APK..."
          RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/application \
            -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
            -F "file=@$APK_PATH" \
            -F "accessType=public" \
            -F "versionAction=create_new_version" \
            -F "sendNotification=true" \
            -w "\n%{http_code}" \
            -s)

          # Parse response
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ SUCCESS! APK uploaded to NativeBridge"
            echo ""

            # Parse response fields - extract app ID directly from response
            APP_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | sed 's/"id":"//;s/"//')

            if [ -z "$APP_ID" ]; then
              echo "❌ ERROR: Could not extract app ID from response"
              echo "Response body:"
              echo "$BODY"
              exit 1
            fi

            echo "App ID: $APP_ID"

            # Extract magic link from response
            MAGIC_LINK=$(echo "$BODY" | grep -o '"magicLink":"[^"]*"' | sed 's/"magicLink":"//;s/"//')

            if [ -z "$MAGIC_LINK" ]; then
              echo "❌ ERROR: Could not extract magic link from response"
              echo "Response body:"
              echo "$BODY"
              exit 1
            fi

            echo "Magic Link: $MAGIC_LINK"
            echo ""

            # Set outputs
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
            echo "magic_link=$MAGIC_LINK" >> $GITHUB_OUTPUT

            # Save to env
            echo "APP_ID=$APP_ID" >> $GITHUB_ENV
            echo "MAGIC_LINK=$MAGIC_LINK" >> $GITHUB_ENV

            echo "╔══════════════════════════════════════════════════════════╗"
            echo "║                  Upload Complete!                        ║"
            echo "╚══════════════════════════════════════════════════════════╝"
            echo ""
            echo "  App ID: $APP_ID"
            echo "  Magic Link: $MAGIC_LINK"
          else
            echo "❌ API call failed (HTTP $HTTP_CODE)"
            echo "Response:"
            echo "$BODY"
            exit 1
          fi

      - name: Upload Summary
        run: |
          echo "### APK Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK Size:** ${{ env.APK_SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App ID:** \`${{ env.APP_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Magic Link:** [${{ env.MAGIC_LINK }}](${{ env.MAGIC_LINK }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Ready for sessionless Appium testing!" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Run Sessionless Appium Test (Single Java File)
  # Uses app_id from input OR from upload job
  # Runs SessionlessAppLaunchTest.java using mvn exec:java
  # ============================================================================
  run-sessionless-test:
    name: Run Sessionless Appium Test
    needs: [upload-apk]
    if: always() && (needs.upload-apk.result == 'success' || github.event.inputs.app_id != '')
    runs-on: ubuntu-latest

    steps:
      - name: Set App ID
        id: set_app_id
        run: |
          # Use manual app_id if provided, otherwise use from upload job
          if [ -n "${{ github.event.inputs.app_id }}" ]; then
            APP_ID="${{ github.event.inputs.app_id }}"
            SOURCE="manual input"
          else
            APP_ID="${{ needs.upload-apk.outputs.app_id }}"
            SOURCE="uploaded APK"
          fi

          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT

          echo "Using App ID: $APP_ID (from $SOURCE)"

      - name: Display Test Configuration
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║       Running Sessionless Appium Test                   ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "App ID: ${{ steps.set_app_id.outputs.app_id }} (from ${{ steps.set_app_id.outputs.source }})"
          echo "Device Name: ${{ github.event.inputs.device_name }}"
          echo "Region: ${{ github.event.inputs.region || env.DEFAULT_REGION }}"
          echo ""
          echo "Mode: SESSIONLESS (auto-creates and auto-deletes session)"
          echo ""

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile Test
        working-directory: appium_tests
        run: |
          echo "Compiling SessionlessAppLaunchTest..."
          mvn clean compile

      - name: Run Sessionless Appium Test
        id: run_test
        working-directory: appium_tests
        timeout-minutes: 15
        continue-on-error: true
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
          APP_ID: ${{ steps.set_app_id.outputs.app_id }}
          DEVICE_NAME: ${{ github.event.inputs.device_name }}
          REGION: ${{ github.event.inputs.region || env.DEFAULT_REGION }}
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Starting Sessionless Appium Test               ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "Configuration:"
          echo "  NATIVEBRIDGE_API_KEY: ${NATIVEBRIDGE_API_KEY:0:15}..."
          echo "  APP_ID: $APP_ID (from ${{ steps.set_app_id.outputs.source }})"
          echo "  DEVICE_NAME: $DEVICE_NAME"
          echo "  REGION: $REGION"
          echo ""
          echo "Test File: SessionlessAppLaunchTest.java"
          echo ""

          # Run single test file using exec:java with sessionless profile
          mvn exec:java -P sessionless 2>&1 | tee test-output.log

          # Check exit code
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ TEST PASSED!"
            echo "test_result=passed" >> $GITHUB_OUTPUT
            exit 0
          else
            echo ""
            echo "❌ TEST FAILED!"
            echo "test_result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sessionless-test-logs-${{ steps.set_app_id.outputs.app_id }}
          path: appium_tests/test-output.log
          retention-days: 30

      - name: Test Summary
        if: always()
        run: |
          echo "### Sessionless Appium Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.run_test.outputs.test_result }}" == "passed" ]; then
            echo "✅ **Status:** PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The app was automatically installed and launched successfully." >> $GITHUB_STEP_SUMMARY
            echo "Device session was automatically created and cleaned up." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more tests failed. Please check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- App ID: \`${{ steps.set_app_id.outputs.app_id }}\` (from ${{ steps.set_app_id.outputs.source }})" >> $GITHUB_STEP_SUMMARY
          echo "- Device: ${{ github.event.inputs.device_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: Sessionless (auto-cleanup enabled)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Only show magic link if APK was uploaded
          if [ -n "${{ needs.upload-apk.outputs.magic_link }}" ]; then
            echo "**Magic Link:** [${{ needs.upload-apk.outputs.magic_link }}](${{ needs.upload-apk.outputs.magic_link }})" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Send Slack Notification
  # ============================================================================
  notify-slack:
    name: Send Slack Notification
    needs: [upload-apk, run-sessionless-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured, skipping notification"
            exit 0
          fi

          # Use manual app_id if provided, otherwise from upload
          if [ -n "${{ github.event.inputs.app_id }}" ]; then
            APP_ID="${{ github.event.inputs.app_id }}"
            APP_SOURCE="manual input"
            VERSION="N/A"
            MAGIC_LINK="N/A"
          else
            APP_ID="${{ needs.upload-apk.outputs.app_id }}"
            APP_SOURCE="uploaded APK"
            VERSION="${{ needs.upload-apk.outputs.version }}"
            MAGIC_LINK="${{ needs.upload-apk.outputs.magic_link }}"
          fi

          TEST_RESULT="${{ needs.run-sessionless-test.outputs.test_result || 'not_run' }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          DEVICE_NAME="${{ github.event.inputs.device_name }}"

          # Determine test status
          if [ "$TEST_RESULT" == "passed" ]; then
            TEST_STATUS="✅ Passed"
            TEST_COLOR="#36a64f"
          elif [ "$TEST_RESULT" == "failed" ]; then
            TEST_STATUS="❌ Failed"
            TEST_COLOR="#ff0000"
          else
            TEST_STATUS="⏭️ Skipped"
            TEST_COLOR="#cccccc"
          fi

          echo "Sending Slack notification..."

          # Build magic link section conditionally
          if [ "$MAGIC_LINK" != "N/A" ]; then
            MAGIC_LINK_SECTION="{
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Magic Link:*\n<${MAGIC_LINK}|Open App>\"
              }
            },"
          else
            MAGIC_LINK_SECTION=""
          fi

          PAYLOAD=$(cat <<EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 Sessionless Appium Test Complete",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*App ID:*\n\`${APP_ID}\` (${APP_SOURCE})"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Version:*\n${VERSION}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Device:*\n${DEVICE_NAME}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Test Result:*\n${TEST_STATUS}"
                  }
                ]
              },
              ${MAGIC_LINK_SECTION}
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Mode: Sessionless (auto-cleanup) | <https://github.com/${REPO}/actions/runs/${RUN_ID}|View Workflow>"
                  }
                ]
              }
            ],
            "attachments": [
              {
                "color": "${TEST_COLOR}",
                "text": "Test Result: ${TEST_STATUS}"
              }
            ]
          }
          EOF
          )

          SLACK_HTTP_CODE=$(curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "%{http_code}" \
            -s -o /dev/null)

          if [ "$SLACK_HTTP_CODE" -eq 200 ]; then
            echo "✓ Slack notification sent successfully"
          else
            echo "⚠️  Slack notification failed (HTTP $SLACK_HTTP_CODE)"
          fi
