name: Release Build

# Trigger on release tags (e.g., v1.0.0, v1.2.3, v2.0.0-beta)
on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  # Default values for NativeBridge session
  DEFAULT_DEVICE_ID: '67a642531a4aa535498192f8'
  DEFAULT_SESSION_VALIDITY: '120'
  DEFAULT_REGION: 'ind'

jobs:
  # ============================================================================
  # Android APK Build
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      nativebridge_link: ${{ steps.nativebridge_upload.outputs.magic_link }}
      nativebridge_versioned_link: ${{ steps.nativebridge_upload.outputs.versioned_link }}
      nativebridge_version: ${{ steps.nativebridge_upload.outputs.nb_version }}
      nativebridge_app_id: ${{ steps.nativebridge_upload.outputs.app_id }}
      session_ids: ${{ steps.start_session.outputs.session_ids }}
      session_urls: ${{ steps.start_session.outputs.session_urls }}
      # Beta variant outputs
      beta_nativebridge_link: ${{ steps.nativebridge_upload_beta.outputs.magic_link }}
      beta_nativebridge_versioned_link: ${{ steps.nativebridge_upload_beta.outputs.versioned_link }}
      beta_nativebridge_version: ${{ steps.nativebridge_upload_beta.outputs.nb_version }}
      beta_nativebridge_app_id: ${{ steps.nativebridge_upload_beta.outputs.app_id }}
      beta_session_ids: ${{ steps.start_session_beta.outputs.session_ids }}
      beta_session_urls: ${{ steps.start_session_beta.outputs.session_urls }}

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history including tag annotations
          fetch-tags: true  # Explicitly fetch tags

      # Fetch tag annotations explicitly
      - name: Fetch tag annotations
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Fetching tag annotation for: $TAG_NAME"
          git fetch --force origin tag "$TAG_NAME" --no-tags
          echo "Tag annotation fetched successfully"

      # Extract version from tag
      - name: Extract version from tag
        id: get_version
        run: |
          # Get tag name (e.g., v1.0.0)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix to get version (e.g., 1.0.0)
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

          # Parse session configuration from tag message
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME")

          # Check if session is enabled
          if echo "$TAG_MESSAGE" | grep -q "\[NB_SESSION_ENABLED\]"; then
            echo "SESSION_ENABLED=true" >> $GITHUB_OUTPUT
            echo "📱 NativeBridge session enabled in tag"

            # Extract device IDs (comma-separated)
            DEVICE_IDS=$(echo "$TAG_MESSAGE" | grep -o "\[NB_DEVICE_IDS:[^]]*\]" | sed 's/\[NB_DEVICE_IDS://;s/\]//')
            if [ -n "$DEVICE_IDS" ]; then
              echo "SESSION_DEVICE_IDS=$DEVICE_IDS" >> $GITHUB_OUTPUT
              echo "   Device IDs: $DEVICE_IDS"
            fi

            # Extract session validity
            VALIDITY=$(echo "$TAG_MESSAGE" | grep -o "\[NB_SESSION_VALIDITY:[^]]*\]" | sed 's/\[NB_SESSION_VALIDITY://;s/\]//')
            if [ -n "$VALIDITY" ]; then
              echo "SESSION_VALIDITY=$VALIDITY" >> $GITHUB_OUTPUT
              echo "   Session validity: $VALIDITY seconds"
            fi
          else
            echo "SESSION_ENABLED=false" >> $GITHUB_OUTPUT
          fi

          # Check if beta build is enabled
          if echo "$TAG_MESSAGE" | grep -q "\[NB_BETA_ENABLED\]"; then
            echo "BETA_ENABLED=true" >> $GITHUB_OUTPUT
            echo "🧪 Beta build enabled in tag"

            # Extract beta device IDs (comma-separated)
            BETA_DEVICE_IDS=$(echo "$TAG_MESSAGE" | grep -o "\[NB_BETA_DEVICE_IDS:[^]]*\]" | sed 's/\[NB_BETA_DEVICE_IDS://;s/\]//')
            if [ -n "$BETA_DEVICE_IDS" ]; then
              echo "BETA_DEVICE_IDS=$BETA_DEVICE_IDS" >> $GITHUB_OUTPUT
              echo "   Beta Device IDs: $BETA_DEVICE_IDS"
            fi
          else
            echo "BETA_ENABLED=false" >> $GITHUB_OUTPUT
          fi

      # ========================================================================
      # NOTE: Android builds are commented out - using pre-built APK instead
      # ========================================================================
      #
      # This workflow uses a PRE-BUILT APK from builds/NativeBridge-Production.apk
      # to enable instant testing of NativeBridge API integration and session features
      # without waiting 8-10 minutes for React Native builds.
      #
      # WHY USE PRE-BUILT APK?
      # - Completes in seconds instead of 8-10 minutes
      # - Minimal CI resource usage
      # - Perfect for testing NativeBridge upload + session APIs
      # - Same experience as actual builds for cloud testing
      #
      # TO ENABLE ACTUAL ANDROID BUILDS:
      # 1. Uncomment all steps below (Node.js setup through Build APK)
      # 2. Comment out the "Use Pre-built APK" step
      # 3. Ensure you have android/ directory with proper React Native setup
      # 4. Configure keystore secrets (optional, auto-generates if missing)
      #
      # OR: Replace with your own build process
      # - Add your build steps here
      # - Ensure final APK is at: release-artifacts/NativeBridge-v${VERSION}.apk
      # - Update APK_SIZE environment variable
      # ========================================================================

      # Set up Node.js
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: ${{ env.NODE_VERSION }}
      #     cache: 'npm'

      # Install dependencies
      # - name: Install dependencies
      #   run: npm ci

      # Set up Java/JDK for Android build
      # - name: Set up JDK
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: ${{ env.JAVA_VERSION }}

      # ========================================================================
      # Use Pre-built APK (for testing NativeBridge API)
      # ========================================================================
      - name: Use Pre-built Production APK
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p release-artifacts

          # Copy pre-built production APK
          cp builds/NativeBridge-Production.apk \
             release-artifacts/NativeBridge-v${VERSION}.apk

          # Get file size
          FILE_SIZE=$(ls -lh release-artifacts/NativeBridge-v${VERSION}.apk | awk '{print $5}')
          echo "✅ Using pre-built production APK: $FILE_SIZE"
          echo "APK_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      # Use Pre-built Beta APK (conditional)
      - name: Use Pre-built Beta APK
        if: steps.get_version.outputs.BETA_ENABLED == 'true'
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          # Check if pre-built beta APK exists
          if [ ! -f "builds/NativeBridge-Beta.apk" ]; then
            echo "❌ Pre-built beta APK not found at builds/NativeBridge-Beta.apk"
            echo "Please add a beta variant APK to enable beta builds."
            echo "See documentation for instructions on building beta variants."
            exit 1
          fi

          # Copy pre-built beta APK with -beta suffix
          cp builds/NativeBridge-Beta.apk \
             release-artifacts/NativeBridge-v${VERSION}-beta.apk

          # Get file size
          BETA_FILE_SIZE=$(ls -lh release-artifacts/NativeBridge-v${VERSION}-beta.apk | awk '{print $5}')
          echo "✅ Using pre-built beta APK: $BETA_FILE_SIZE"
          echo "BETA_APK_SIZE=$BETA_FILE_SIZE" >> $GITHUB_ENV

      # ========================================================================
      # COMMENTED OUT: Actual Android Build Steps
      # Uncomment below to enable real React Native builds
      # ========================================================================

      # # Generate or decode keystore
      # - name: Setup Android Keystore
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      #     KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #   run: |
      #     mkdir -p android/app
      #     if [ -n "$KEYSTORE_BASE64" ]; then
      #       echo "Using keystore from GitHub Secrets"
      #       echo $KEYSTORE_BASE64 | base64 -d > android/app/release.keystore
      #       KEYSTORE_FILE="release.keystore"
      #       KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}"
      #       KEY_ALIAS="${KEY_ALIAS}"
      #       KEY_PASSWORD="${KEY_PASSWORD}"
      #     else
      #       echo "No keystore secrets found - generating a new keystore for CI"
      #       KEYSTORE_FILE="ci-release.keystore"
      #       KEYSTORE_PASSWORD="nativebridge2025"
      #       KEY_ALIAS="nativebridge-key"
      #       KEY_PASSWORD="nativebridge2025"
      #       keytool -genkeypair -v -storetype PKCS12 \
      #         -keystore android/app/$KEYSTORE_FILE \
      #         -alias $KEY_ALIAS -keyalg RSA -keysize 2048 \
      #         -validity 10000 \
      #         -storepass $KEYSTORE_PASSWORD \
      #         -keypass $KEY_PASSWORD \
      #         -dname "CN=NativeBridge CI, OU=Development, O=NativeBridge, L=City, ST=State, C=US"
      #       echo "✅ Generated new keystore for CI build"
      #     fi
      #     cat >> android/gradle.properties << EOF
      #     MYAPP_RELEASE_STORE_FILE=$KEYSTORE_FILE
      #     MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
      #     MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
      #     MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
      #     EOF
      #     echo "✅ Keystore configured successfully"

      # # Update version in build.gradle
      # - name: Update version in build.gradle
      #   run: |
      #     VERSION=${{ steps.get_version.outputs.VERSION }}
      #     VERSION_CODE=$(echo $VERSION | sed 's/-.*//' | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
      #     sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
      #     sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
      #     echo "Updated to versionCode: $VERSION_CODE, versionName: $VERSION"

      # # Make gradlew executable
      # - name: Make gradlew executable
      #   run: chmod +x android/gradlew

      # # Patch React Native Gradle Plugin
      # - name: Patch React Native Gradle Plugin
      #   run: |
      #     PLUGIN_BUILD_FILE="node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build.gradle.kts"
      #     if [ -f "$PLUGIN_BUILD_FILE" ]; then
      #       sed -i 's/allWarningsAsErrors = true/allWarningsAsErrors = false/g' "$PLUGIN_BUILD_FILE"
      #       if ! grep -q "allWarningsAsErrors" "$PLUGIN_BUILD_FILE"; then
      #         sed -i '/kotlinOptions {/a\    allWarningsAsErrors = false' "$PLUGIN_BUILD_FILE"
      #       fi
      #     fi

      # # Configure Gradle Properties for CI
      # - name: Configure Gradle Properties for CI
      #   run: |
      #     cat >> android/gradle.properties << 'EOF'
      #     kotlin.allWarningsAsErrors=false
      #     kotlin.suppressWarnings=true
      #     org.gradle.daemon=false
      #     org.gradle.parallel=true
      #     org.gradle.caching=true
      #     org.gradle.configureondemand=true
      #     EOF

      # # Build Android Release APK
      # - name: Build Android Release APK
      #   run: |
      #     cd android
      #     ./gradlew clean
      #     ./gradlew assembleRelease --stacktrace \
      #       -Dkotlin.compiler.execution.strategy=in-process \
      #       -Pkotlin.allWarningsAsErrors=false

      # # Rename APK with version
      # - name: Rename APK with version
      #   run: |
      #     VERSION=${{ steps.get_version.outputs.VERSION }}
      #     mkdir -p release-artifacts
      #     cp android/app/build/outputs/apk/release/app-release.apk \
      #        release-artifacts/NativeBridge-v${VERSION}.apk
      #     FILE_SIZE=$(ls -lh release-artifacts/NativeBridge-v${VERSION}.apk | awk '{print $5}')
      #     echo "APK Size: $FILE_SIZE"
      #     echo "APK_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      # Upload APK as artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeBridge-Android-v${{ steps.get_version.outputs.VERSION }}
          path: release-artifacts/NativeBridge-v${{ steps.get_version.outputs.VERSION }}.apk
          retention-days: 90

      # Upload Beta APK as artifact (conditional)
      - name: Upload Beta Android APK
        if: steps.get_version.outputs.BETA_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NativeBridge-Android-Beta-v${{ steps.get_version.outputs.VERSION }}
          path: release-artifacts/NativeBridge-v${{ steps.get_version.outputs.VERSION }}-beta.apk
          retention-days: 90

      # Upload to NativeBridge Platform
      - name: Upload APK to NativeBridge
        id: nativebridge_upload
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          APK_PATH="release-artifacts/NativeBridge-v${VERSION}.apk"

          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "⚠️  NATIVEBRIDGE_API_KEY secret not configured - skipping NativeBridge upload"
            echo "To enable NativeBridge uploads, add NATIVEBRIDGE_API_KEY to GitHub Secrets"
            exit 0
          fi

          echo "📤 Uploading APK to NativeBridge..."

          # Upload to NativeBridge API
          RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/application \
            -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
            -F "file=@$APK_PATH" \
            -F "accessType=public" \
            -F "versionAction=create_new_version" \
            -F "sendNotification=true" \
            -w "\n%{http_code}" \
            -s)

          # Extract HTTP status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully uploaded to NativeBridge!"

            # Parse response using grep and sed
            MAGIC_LINK=$(echo "$BODY" | grep -o '"magicLink":"[^"]*"' | sed 's/"magicLink":"//;s/"//')
            VERSIONED_LINK=$(echo "$BODY" | grep -o '"versionedMagicLink":"[^"]*"' | sed 's/"versionedMagicLink":"//;s/"//')
            NB_VERSION=$(echo "$BODY" | grep -o '"version":"[^"]*"' | sed 's/"version":"//;s/"//')
            APP_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | sed 's/"id":"//;s/"//')

            echo "📱 App ID: $APP_ID"
            echo "🔢 NativeBridge Version: $NB_VERSION"
            echo "🔗 Magic Link (Latest): $MAGIC_LINK"
            echo "🔗 Versioned Link: $VERSIONED_LINK"

            # Save to environment for later steps
            echo "NATIVEBRIDGE_LINK=$MAGIC_LINK" >> $GITHUB_ENV
            echo "NATIVEBRIDGE_VERSIONED_LINK=$VERSIONED_LINK" >> $GITHUB_ENV
            echo "NATIVEBRIDGE_VERSION=$NB_VERSION" >> $GITHUB_ENV
            echo "NATIVEBRIDGE_APP_ID=$APP_ID" >> $GITHUB_ENV

            # Set outputs for create-release job
            echo "magic_link=$MAGIC_LINK" >> $GITHUB_OUTPUT
            echo "versioned_link=$VERSIONED_LINK" >> $GITHUB_OUTPUT
            echo "nb_version=$NB_VERSION" >> $GITHUB_OUTPUT
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to upload to NativeBridge (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      # Upload Beta APK to NativeBridge (Optional)
      - name: Upload Beta APK to NativeBridge
        id: nativebridge_upload_beta
        if: steps.get_version.outputs.BETA_ENABLED == 'true'
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          APK_PATH="release-artifacts/NativeBridge-v${VERSION}-beta.apk"

          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "⚠️  NATIVEBRIDGE_API_KEY secret not configured - skipping beta upload"
            exit 0
          fi

          echo "📤 Uploading Beta APK to NativeBridge..."

          # Upload to NativeBridge API
          RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/application \
            -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
            -F "file=@$APK_PATH" \
            -F "accessType=public" \
            -F "versionAction=create_new_version" \
            -F "sendNotification=true" \
            -w "\n%{http_code}" \
            -s)

          # Extract HTTP status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully uploaded beta variant to NativeBridge!"

            # Parse response
            MAGIC_LINK=$(echo "$BODY" | grep -o '"magicLink":"[^"]*"' | sed 's/"magicLink":"//;s/"//')
            VERSIONED_LINK=$(echo "$BODY" | grep -o '"versionedMagicLink":"[^"]*"' | sed 's/"versionedMagicLink":"//;s/"//')
            NB_VERSION=$(echo "$BODY" | grep -o '"version":"[^"]*"' | sed 's/"version":"//;s/"//')
            APP_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | sed 's/"id":"//;s/"//')

            echo "📱 Beta App ID: $APP_ID"
            echo "🔢 NativeBridge Version: $NB_VERSION"
            echo "🔗 Magic Link (Latest): $MAGIC_LINK"
            echo "🔗 Versioned Link: $VERSIONED_LINK"

            # Save to environment for later steps
            echo "BETA_NATIVEBRIDGE_LINK=$MAGIC_LINK" >> $GITHUB_ENV
            echo "BETA_NATIVEBRIDGE_VERSIONED_LINK=$VERSIONED_LINK" >> $GITHUB_ENV
            echo "BETA_NATIVEBRIDGE_VERSION=$NB_VERSION" >> $GITHUB_ENV
            echo "BETA_NATIVEBRIDGE_APP_ID=$APP_ID" >> $GITHUB_ENV

            # Set outputs for create-release job
            echo "magic_link=$MAGIC_LINK" >> $GITHUB_OUTPUT
            echo "versioned_link=$VERSIONED_LINK" >> $GITHUB_OUTPUT
            echo "nb_version=$NB_VERSION" >> $GITHUB_OUTPUT
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to upload beta to NativeBridge (HTTP $HTTP_CODE)"
            echo "$BODY"
            # Don't fail the build, just warn
            echo "⚠️  Continuing without beta upload..."
          fi

      # Start NativeBridge Sessions (Multiple Devices - Optional)
      - name: Start NativeBridge Production Sessions
        id: start_session
        if: steps.get_version.outputs.SESSION_ENABLED == 'true'
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
          DEVICE_IDS: ${{ steps.get_version.outputs.SESSION_DEVICE_IDS || env.DEFAULT_DEVICE_ID }}
          SESSION_VALIDITY: ${{ steps.get_version.outputs.SESSION_VALIDITY || env.DEFAULT_SESSION_VALIDITY }}
        run: |
          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "⚠️  NATIVEBRIDGE_API_KEY secret not configured - skipping session start"
            exit 0
          fi

          if [ -z "${{ env.NATIVEBRIDGE_APP_ID }}" ]; then
            echo "⚠️  App ID not available - skipping session start"
            exit 0
          fi

          # Validate session validity (must be between 30 and 300 seconds)
          VALIDITY=$SESSION_VALIDITY
          if [ "$VALIDITY" -lt 30 ]; then
            echo "⚠️  Session validity too low ($VALIDITY seconds), using minimum: 30 seconds"
            VALIDITY=30
          elif [ "$VALIDITY" -gt 300 ]; then
            echo "⚠️  Session validity too high ($VALIDITY seconds), using maximum: 300 seconds"
            VALIDITY=300
          fi

          # Split device IDs by comma and start sessions for each
          IFS=',' read -ra DEVICES <<< "$DEVICE_IDS"
          SESSION_IDS_LIST=""
          SESSION_URLS_LIST=""

          echo "🚀 Starting ${#DEVICES[@]} production session(s)..."

          for i in "${!DEVICES[@]}"; do
            DEVICE_ID="${DEVICES[$i]}"

            # Add 10-second delay between sessions (except for the first one)
            if [ $i -gt 0 ]; then
              echo ""
              echo "⏳ Waiting 10 seconds before starting next session..."
              sleep 10
            fi

            echo ""
            echo "[$((i+1))/${#DEVICES[@]}] Starting session on device: $DEVICE_ID"
            echo "   App ID: ${{ env.NATIVEBRIDGE_APP_ID }}"
            echo "   Region: ${{ env.DEFAULT_REGION }}"
            echo "   Validity: $VALIDITY seconds"

            # Start session via NativeBridge API
            RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/device/session \
              -H "accept: application/json" \
              -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"deviceType\": \"android\",
                \"deviceId\": \"$DEVICE_ID\",
                \"appId\": \"${{ env.NATIVEBRIDGE_APP_ID }}\",
                \"region\": \"${{ env.DEFAULT_REGION }}\",
                \"executionValidity\": $VALIDITY
              }" \
              -w "\n%{http_code}" \
              -s)

            # Extract HTTP status code
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Session started successfully!"

              # Parse response
              SESSION_ID=$(echo "$BODY" | grep -o '"sessionId":"[^"]*"' | sed 's/"sessionId":"//;s/"//')
              SESSION_URL=$(echo "$BODY" | grep -o '"sessionUrl":"[^"]*"' | sed 's/"sessionUrl":"//;s/"//')

              echo "📱 Session ID: $SESSION_ID"
              echo "🔗 Session URL: $SESSION_URL"

              # Append to lists
              if [ -z "$SESSION_IDS_LIST" ]; then
                SESSION_IDS_LIST="$SESSION_ID"
                SESSION_URLS_LIST="$SESSION_URL"
              else
                SESSION_IDS_LIST="$SESSION_IDS_LIST,$SESSION_ID"
                SESSION_URLS_LIST="$SESSION_URLS_LIST,$SESSION_URL"
              fi

              # Send Slack notification immediately if webhook is configured
              if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
                echo "📤 Sending Slack notification for this session..."

                PAYLOAD=$(cat <<EOF
                {
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 Production Session Started [$((i+1))/${#DEVICES[@]}]",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*App Version:*\n${{ steps.get_version.outputs.VERSION }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Device:*\n\`${DEVICE_ID}\`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Session ID:*\n\`${SESSION_ID}\`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Validity:*\n${VALIDITY} seconds"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "🔗 *Session URL:*\n<${SESSION_URL}|Launch Session Now>"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Triggered by GitHub Actions • <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                        }
                      ]
                    }
                  ]
                }
                EOF
                )

                SLACK_HTTP_CODE=$(curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
                  -H "Content-Type: application/json" \
                  -d "$PAYLOAD" \
                  -w "%{http_code}" \
                  -s -o /dev/null)

                if [ "$SLACK_HTTP_CODE" -eq 200 ]; then
                  echo "✅ Slack notification sent"
                else
                  echo "⚠️  Slack notification failed (HTTP $SLACK_HTTP_CODE)"
                fi
              fi
            else
              echo "❌ Failed to start session (HTTP $HTTP_CODE)"
              echo "$BODY"
            fi
          done

          # Save all sessions to environment (comma-separated)
          if [ -n "$SESSION_IDS_LIST" ]; then
            echo "SESSION_IDS=$SESSION_IDS_LIST" >> $GITHUB_ENV
            echo "SESSION_URLS=$SESSION_URLS_LIST" >> $GITHUB_ENV
            echo "session_ids=$SESSION_IDS_LIST" >> $GITHUB_OUTPUT
            echo "session_urls=$SESSION_URLS_LIST" >> $GITHUB_OUTPUT

            echo ""
            echo "✅ Started ${#DEVICES[@]} production session(s)"
          else
            echo "⚠️  No sessions were started"
          fi

      # Start NativeBridge Beta Sessions (Multiple Devices - Optional)
      - name: Start NativeBridge Beta Sessions
        id: start_session_beta
        if: steps.get_version.outputs.SESSION_ENABLED == 'true' && steps.get_version.outputs.BETA_ENABLED == 'true'
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
          BETA_DEVICE_IDS: ${{ steps.get_version.outputs.BETA_DEVICE_IDS || steps.get_version.outputs.SESSION_DEVICE_IDS || env.DEFAULT_DEVICE_ID }}
          SESSION_VALIDITY: ${{ steps.get_version.outputs.SESSION_VALIDITY || env.DEFAULT_SESSION_VALIDITY }}
        run: |
          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "⚠️  NATIVEBRIDGE_API_KEY secret not configured - skipping beta session start"
            exit 0
          fi

          if [ -z "${{ env.BETA_NATIVEBRIDGE_APP_ID }}" ]; then
            echo "⚠️  Beta App ID not available - skipping beta session start"
            exit 0
          fi

          # Validate session validity (must be between 30 and 300 seconds)
          VALIDITY=$SESSION_VALIDITY
          if [ "$VALIDITY" -lt 30 ]; then
            echo "⚠️  Session validity too low ($VALIDITY seconds), using minimum: 30 seconds"
            VALIDITY=30
          elif [ "$VALIDITY" -gt 300 ]; then
            echo "⚠️  Session validity too high ($VALIDITY seconds), using maximum: 300 seconds"
            VALIDITY=300
          fi

          # Split device IDs by comma and start sessions for each
          IFS=',' read -ra DEVICES <<< "$BETA_DEVICE_IDS"
          BETA_SESSION_IDS_LIST=""
          BETA_SESSION_URLS_LIST=""

          echo "🚀 Starting ${#DEVICES[@]} beta session(s)..."

          for i in "${!DEVICES[@]}"; do
            DEVICE_ID="${DEVICES[$i]}"

            # Add 10-second delay between sessions (except for the first one)
            if [ $i -gt 0 ]; then
              echo ""
              echo "⏳ Waiting 10 seconds before starting next beta session..."
              sleep 10
            fi

            echo ""
            echo "[$((i+1))/${#DEVICES[@]}] Starting beta session on device: $DEVICE_ID"
            echo "   Beta App ID: ${{ env.BETA_NATIVEBRIDGE_APP_ID }}"
            echo "   Region: ${{ env.DEFAULT_REGION }}"
            echo "   Validity: $VALIDITY seconds"

            # Start beta session via NativeBridge API
            RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/device/session \
              -H "accept: application/json" \
              -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"deviceType\": \"android\",
                \"deviceId\": \"$DEVICE_ID\",
                \"appId\": \"${{ env.BETA_NATIVEBRIDGE_APP_ID }}\",
                \"region\": \"${{ env.DEFAULT_REGION }}\",
                \"executionValidity\": $VALIDITY
              }" \
              -w "\n%{http_code}" \
              -s)

            # Extract HTTP status code
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Beta session started successfully!"

              # Parse response
              SESSION_ID=$(echo "$BODY" | grep -o '"sessionId":"[^"]*"' | sed 's/"sessionId":"//;s/"//')
              SESSION_URL=$(echo "$BODY" | grep -o '"sessionUrl":"[^"]*"' | sed 's/"sessionUrl":"//;s/"//')

              echo "📱 Session ID: $SESSION_ID"
              echo "🔗 Session URL: $SESSION_URL"

              # Append to lists
              if [ -z "$BETA_SESSION_IDS_LIST" ]; then
                BETA_SESSION_IDS_LIST="$SESSION_ID"
                BETA_SESSION_URLS_LIST="$SESSION_URL"
              else
                BETA_SESSION_IDS_LIST="$BETA_SESSION_IDS_LIST,$SESSION_ID"
                BETA_SESSION_URLS_LIST="$BETA_SESSION_URLS_LIST,$SESSION_URL"
              fi

              # Send Slack notification immediately if webhook is configured
              if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
                echo "📤 Sending Slack notification for this beta session..."

                PAYLOAD=$(cat <<EOF
                {
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🧪 Beta Session Started [$((i+1))/${#DEVICES[@]}]",
                        "emoji": true
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*App Version:*\n${{ steps.get_version.outputs.VERSION }}-beta"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Device:*\n\`${DEVICE_ID}\`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Session ID:*\n\`${SESSION_ID}\`"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Validity:*\n${VALIDITY} seconds"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "🔗 *Beta Session URL:*\n<${SESSION_URL}|Launch Beta Session Now>"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Triggered by GitHub Actions • <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                        }
                      ]
                    }
                  ]
                }
                EOF
                )

                SLACK_HTTP_CODE=$(curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
                  -H "Content-Type: application/json" \
                  -d "$PAYLOAD" \
                  -w "%{http_code}" \
                  -s -o /dev/null)

                if [ "$SLACK_HTTP_CODE" -eq 200 ]; then
                  echo "✅ Slack notification sent"
                else
                  echo "⚠️  Slack notification failed (HTTP $SLACK_HTTP_CODE)"
                fi
              fi
            else
              echo "❌ Failed to start beta session (HTTP $HTTP_CODE)"
              echo "$BODY"
            fi
          done

          # Save all beta sessions to environment (comma-separated)
          if [ -n "$BETA_SESSION_IDS_LIST" ]; then
            echo "BETA_SESSION_IDS=$BETA_SESSION_IDS_LIST" >> $GITHUB_ENV
            echo "BETA_SESSION_URLS=$BETA_SESSION_URLS_LIST" >> $GITHUB_ENV
            echo "session_ids=$BETA_SESSION_IDS_LIST" >> $GITHUB_OUTPUT
            echo "session_urls=$BETA_SESSION_URLS_LIST" >> $GITHUB_OUTPUT

            echo ""
            echo "✅ Started ${#DEVICES[@]} beta session(s)"
          else
            echo "⚠️  No beta sessions were started"
          fi


      # Output build info
      - name: Build Summary
        run: |
          echo "### Android Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** NativeBridge-v${{ steps.get_version.outputs.VERSION }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${{ env.APK_SIZE }}" >> $GITHUB_STEP_SUMMARY

          # Add beta build info if enabled
          if [ "${{ steps.get_version.outputs.BETA_ENABLED }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Beta Version:** ${{ steps.get_version.outputs.VERSION }}-beta" >> $GITHUB_STEP_SUMMARY
            echo "**Beta APK:** NativeBridge-v${{ steps.get_version.outputs.VERSION }}-beta.apk" >> $GITHUB_STEP_SUMMARY
            echo "**Beta Size:** ${{ env.BETA_APK_SIZE }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Add NativeBridge info if uploaded
          if [ -n "${{ env.NATIVEBRIDGE_LINK }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 NativeBridge Upload - Production ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**App ID:** ${{ env.NATIVEBRIDGE_APP_ID }}" >> $GITHUB_STEP_SUMMARY
            echo "**NativeBridge Version:** ${{ env.NATIVEBRIDGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "**Magic Link (Latest):** [${{ env.NATIVEBRIDGE_LINK }}](${{ env.NATIVEBRIDGE_LINK }})" >> $GITHUB_STEP_SUMMARY
            echo "**Versioned Link:** [${{ env.NATIVEBRIDGE_VERSIONED_LINK }}](${{ env.NATIVEBRIDGE_VERSIONED_LINK }})" >> $GITHUB_STEP_SUMMARY
          fi

          # Add beta NativeBridge info if uploaded
          if [ -n "${{ env.BETA_NATIVEBRIDGE_LINK }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🧪 NativeBridge Upload - Beta ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Beta App ID:** ${{ env.BETA_NATIVEBRIDGE_APP_ID }}" >> $GITHUB_STEP_SUMMARY
            echo "**NativeBridge Version:** ${{ env.BETA_NATIVEBRIDGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "**Magic Link (Latest):** [${{ env.BETA_NATIVEBRIDGE_LINK }}](${{ env.BETA_NATIVEBRIDGE_LINK }})" >> $GITHUB_STEP_SUMMARY
            echo "**Versioned Link:** [${{ env.BETA_NATIVEBRIDGE_VERSIONED_LINK }}](${{ env.BETA_NATIVEBRIDGE_VERSIONED_LINK }})" >> $GITHUB_STEP_SUMMARY
          fi

          # Add production session info if started
          if [ -n "${{ env.SESSION_URLS }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Active Production Sessions ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Split comma-separated values
            IFS=',' read -ra SESSION_IDS_ARRAY <<< "${{ env.SESSION_IDS }}"
            IFS=',' read -ra SESSION_URLS_ARRAY <<< "${{ env.SESSION_URLS }}"
            IFS=',' read -ra DEVICE_IDS_ARRAY <<< "${{ steps.get_version.outputs.SESSION_DEVICE_IDS }}"

            echo "**Sessions:** ${#SESSION_IDS_ARRAY[@]} device(s)" >> $GITHUB_STEP_SUMMARY
            echo "**Validity:** ${{ steps.get_version.outputs.SESSION_VALIDITY || env.DEFAULT_SESSION_VALIDITY }} seconds" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Loop through sessions
            for i in "${!SESSION_IDS_ARRAY[@]}"; do
              SESSION_NUM=$((i+1))
              echo "**Session $SESSION_NUM:**" >> $GITHUB_STEP_SUMMARY
              echo "- Device: \`${DEVICE_IDS_ARRAY[$i]}\`" >> $GITHUB_STEP_SUMMARY
              echo "- Session ID: \`${SESSION_IDS_ARRAY[$i]}\`" >> $GITHUB_STEP_SUMMARY
              echo "- [Launch Session →](${SESSION_URLS_ARRAY[$i]})" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Add beta session info if started
          if [ -n "${{ env.BETA_SESSION_URLS }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🧪 Active Beta Sessions ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Split comma-separated values
            IFS=',' read -ra BETA_SESSION_IDS_ARRAY <<< "${{ env.BETA_SESSION_IDS }}"
            IFS=',' read -ra BETA_SESSION_URLS_ARRAY <<< "${{ env.BETA_SESSION_URLS }}"
            IFS=',' read -ra BETA_DEVICE_IDS_ARRAY <<< "${{ steps.get_version.outputs.BETA_DEVICE_IDS }}"

            echo "**Sessions:** ${#BETA_SESSION_IDS_ARRAY[@]} device(s)" >> $GITHUB_STEP_SUMMARY
            echo "**Validity:** ${{ steps.get_version.outputs.SESSION_VALIDITY || env.DEFAULT_SESSION_VALIDITY }} seconds" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Loop through sessions
            for i in "${!BETA_SESSION_IDS_ARRAY[@]}"; do
              SESSION_NUM=$((i+1))
              echo "**Beta Session $SESSION_NUM:**" >> $GITHUB_STEP_SUMMARY
              echo "- Device: \`${BETA_DEVICE_IDS_ARRAY[$i]}\`" >> $GITHUB_STEP_SUMMARY
              echo "- Session ID: \`${BETA_SESSION_IDS_ARRAY[$i]}\`" >> $GITHUB_STEP_SUMMARY
              echo "- [Launch Beta Session →](${BETA_SESSION_URLS_ARRAY[$i]})" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            done
          fi

  # ============================================================================
  # iOS Simulator Build (Uses Pre-built App)
  # ============================================================================
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest
    outputs:
      nativebridge_link: ${{ steps.nativebridge_upload.outputs.magic_link }}
      nativebridge_versioned_link: ${{ steps.nativebridge_upload.outputs.versioned_link }}
      nativebridge_version: ${{ steps.nativebridge_upload.outputs.nb_version }}
      nativebridge_app_id: ${{ steps.nativebridge_upload.outputs.app_id }}

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history including tag annotations
          fetch-tags: true  # Explicitly fetch tags

      # Extract version from tag
      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # NOTE: iOS builds are very resource-intensive in CI/CD environments.
      # Building React Native apps for both arm64 and x86_64 architectures can:
      # - Take 10+ minutes on GitHub Actions runners
      # - Consume significant CPU and memory
      # - Often timeout or fail due to resource exhaustion
      #
      # SOLUTION: Use pre-built .app.zip files
      # To create a new pre-built iOS app:
      # 1. Build locally: cd ios && pod install && xcodebuild -workspace NativeBridgeApp.xcworkspace \
      #    -scheme NativeBridgeApp -configuration Release -sdk iphonesimulator \
      #    -destination 'generic/platform=iOS Simulator' -derivedDataPath build clean build
      # 2. Zip the app: cd build/Build/Products/Release-iphonesimulator && \
      #    zip -r -y ../../../../prebuilt/NativeBridgeApp.app.zip NativeBridgeApp.app
      # 3. Commit: git add ios/prebuilt/NativeBridgeApp.app.zip && git commit -m "Update pre-built iOS app"
      #
      # This approach:
      # ✅ Completes in seconds instead of minutes
      # ✅ Uses minimal CI resources
      # ✅ Avoids architecture-specific build issues
      # ✅ Still provides instant cloud testing via NativeBridge

      # Uncomment below to enable actual iOS building (requires significant CI resources)
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: ${{ env.NODE_VERSION }}
      #     cache: 'npm'
      #
      # - name: Install npm dependencies
      #   run: npm ci
      #
      # - name: Install CocoaPods dependencies
      #   run: |
      #     cd ios
      #     pod repo update
      #     pod install --repo-update
      #
      # - name: Set up Xcode
      #   run: |
      #     sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      #     xcodebuild -version
      #
      # - name: Build iOS .app for Simulator
      #   run: |
      #     VERSION=${{ steps.get_version.outputs.VERSION }}
      #     cd ios
      #     xcodebuild \
      #       -workspace NativeBridgeApp.xcworkspace \
      #       -scheme NativeBridgeApp \
      #       -configuration Release \
      #       -sdk iphonesimulator \
      #       -destination 'generic/platform=iOS Simulator' \
      #       -derivedDataPath build \
      #       MARKETING_VERSION=$VERSION \
      #       clean build
      #
      #     # Create zip
      #     cd build/Build/Products/Release-iphonesimulator
      #     mkdir -p ../../../../release-artifacts
      #     zip -r -y ../../../../release-artifacts/NativeBridge-iOS-v${VERSION}.app.zip NativeBridgeApp.app

      # Use pre-built iOS app (much faster and more reliable)
      - name: Use Pre-built iOS App
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          echo "📱 Using pre-built iOS app..."

          # Check if pre-built app exists
          if [ ! -f "ios/prebuilt/NativeBridgeApp.app.zip" ]; then
            echo "❌ Pre-built iOS app not found at ios/prebuilt/NativeBridgeApp.app.zip"
            echo "Please build the app locally and commit the zip file. See comments above for instructions."
            exit 1
          fi

          # Create release artifacts directory
          mkdir -p release-artifacts

          # Copy pre-built app to release artifacts with versioned name
          cp ios/prebuilt/NativeBridgeApp.app.zip release-artifacts/NativeBridge-iOS-v${VERSION}.app.zip

          # Get file size
          ZIP_SIZE=$(ls -lh release-artifacts/NativeBridge-iOS-v${VERSION}.app.zip | awk '{print $5}')
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV

          echo "✅ Pre-built iOS app ready: NativeBridge-iOS-v${VERSION}.app.zip ($ZIP_SIZE)"

      # Upload as artifact
      - name: Upload iOS .app.zip
        uses: actions/upload-artifact@v4
        with:
          name: NativeBridge-iOS-v${{ steps.get_version.outputs.VERSION }}
          path: release-artifacts/NativeBridge-iOS-v${{ steps.get_version.outputs.VERSION }}.app.zip
          retention-days: 90

      # Upload to NativeBridge Platform
      - name: Upload iOS app to NativeBridge
        id: nativebridge_upload
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          APP_PATH="release-artifacts/NativeBridge-iOS-v${VERSION}.app.zip"

          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "⚠️  NATIVEBRIDGE_API_KEY secret not configured - skipping NativeBridge upload"
            echo "To enable NativeBridge uploads, add NATIVEBRIDGE_API_KEY to GitHub Secrets"
            exit 0
          fi

          echo "📤 Uploading iOS app to NativeBridge..."

          # Upload to NativeBridge API
          RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/application \
            -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
            -F "file=@$APP_PATH" \
            -F "accessType=public" \
            -F "versionAction=create_new_version" \
            -F "sendNotification=true" \
            -w "\n%{http_code}" \
            -s)

          # Extract HTTP status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully uploaded to NativeBridge!"

            # Parse response
            MAGIC_LINK=$(echo "$BODY" | grep -o '"magicLink":"[^"]*"' | sed 's/"magicLink":"//;s/"//')
            VERSIONED_LINK=$(echo "$BODY" | grep -o '"versionedMagicLink":"[^"]*"' | sed 's/"versionedMagicLink":"//;s/"//')
            NB_VERSION=$(echo "$BODY" | grep -o '"version":"[^"]*"' | sed 's/"version":"//;s/"//')
            APP_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | sed 's/"id":"//;s/"//')

            echo "📱 App ID: $APP_ID"
            echo "🔢 NativeBridge Version: $NB_VERSION"
            echo "🔗 Magic Link (Latest): $MAGIC_LINK"
            echo "🔗 Versioned Link: $VERSIONED_LINK"

            # Save to environment
            echo "NATIVEBRIDGE_LINK=$MAGIC_LINK" >> $GITHUB_ENV
            echo "NATIVEBRIDGE_VERSIONED_LINK=$VERSIONED_LINK" >> $GITHUB_ENV
            echo "NATIVEBRIDGE_VERSION=$NB_VERSION" >> $GITHUB_ENV
            echo "NATIVEBRIDGE_APP_ID=$APP_ID" >> $GITHUB_ENV

            # Set outputs
            echo "magic_link=$MAGIC_LINK" >> $GITHUB_OUTPUT
            echo "versioned_link=$VERSIONED_LINK" >> $GITHUB_OUTPUT
            echo "nb_version=$NB_VERSION" >> $GITHUB_OUTPUT
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to upload to NativeBridge (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      # Output build info
      - name: Build Summary
        run: |
          echo "### iOS Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**App:** NativeBridge-iOS-v${{ steps.get_version.outputs.VERSION }}.app.zip" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${{ env.ZIP_SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Using pre-built iOS app for faster CI/CD" >> $GITHUB_STEP_SUMMARY

          # Add NativeBridge info if uploaded
          if [ -n "${{ env.NATIVEBRIDGE_LINK }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 NativeBridge Upload ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**App ID:** ${{ env.NATIVEBRIDGE_APP_ID }}" >> $GITHUB_STEP_SUMMARY
            echo "**NativeBridge Version:** ${{ env.NATIVEBRIDGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "**Magic Link (Latest):** [${{ env.NATIVEBRIDGE_LINK }}](${{ env.NATIVEBRIDGE_LINK }})" >> $GITHUB_STEP_SUMMARY
            echo "**Versioned Link:** [${{ env.NATIVEBRIDGE_VERSIONED_LINK }}](${{ env.NATIVEBRIDGE_VERSIONED_LINK }})" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history including tag annotations
          fetch-tags: true  # Explicitly fetch tags

      # Extract version from tag
      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      # Download Android artifact
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: NativeBridge-Android-v${{ steps.get_version.outputs.VERSION }}
          path: artifacts/

      # Download Beta Android artifact (conditional - don't fail if not exists)
      - name: Download Beta Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NativeBridge-Android-Beta-v${{ steps.get_version.outputs.VERSION }}
          path: artifacts/

      # Download iOS artifact
      - name: Download iOS .app.zip
        uses: actions/download-artifact@v4
        with:
          name: NativeBridge-iOS-v${{ steps.get_version.outputs.VERSION }}
          path: artifacts/

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.TAG_NAME }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.TAG_NAME, 'beta') || contains(steps.get_version.outputs.TAG_NAME, 'alpha') }}
          body: |
            ## NativeBridge Release ${{ steps.get_version.outputs.VERSION }}

            ### 🚀 Quick Test via NativeBridge Cloud

            **Run this app instantly in the cloud** - No installation required!

            **☁️ Android (Production): [Launch in NativeBridge Cloud](${{ needs.build-android.outputs.nativebridge_versioned_link }})**

            ${{ needs.build-android.outputs.beta_nativebridge_versioned_link && format('**🧪 Android (Beta): [Launch Beta in NativeBridge Cloud]({0})**

            ', needs.build-android.outputs.beta_nativebridge_versioned_link) || '' }}**☁️ iOS: [Launch in NativeBridge Cloud](${{ needs.build-ios.outputs.nativebridge_versioned_link }})**

            ${{ needs.build-android.outputs.session_url && format('### 🎮 Active Session - Production (Android)

            **🔗 [Launch Production Session]({0})**

            - **Session ID:** `{1}`
            - **Direct access to running app** on NativeBridge device
            - Session may expire based on configured validity period

            > 💡 This is a live session running on an actual device. Use this for immediate testing!

            ---
            ', needs.build-android.outputs.session_url, needs.build-android.outputs.session_id) || '' }}${{ needs.build-android.outputs.beta_session_url && format('### 🧪 Active Session - Beta (Android)

            **🔗 [Launch Beta Session]({0})**

            - **Session ID:** `{1}`
            - **Direct access to running beta app** on NativeBridge device
            - Session may expire based on configured validity period

            > 💡 This is a live beta session running on a separate device. Use this for testing beta features!

            ---
            ', needs.build-android.outputs.beta_session_url, needs.build-android.outputs.beta_session_id) || '' }}

            #### What is NativeBridge?

            NativeBridge lets you **run Android apps instantly in your browser** using:
            - ☁️ **Cloud Emulators** - Test on virtual Android devices
            - 📱 **Real Physical Devices** - Run on actual Android hardware in the cloud
            - 🚀 **One-Click Launch** - No setup, no installation, just click and test
            - 🌐 **Any Platform** - Works on Windows, Mac, Linux, even mobile browsers

            #### How to Use:
            1. **Click the NativeBridge link above**
            2. **Choose your test environment:**
               - Cloud emulator (instant, free)
               - Real physical device (actual hardware)
            3. **App launches automatically** in the cloud
            4. **Test and interact** directly in your browser
            5. **Share the link** with your team for instant testing

            > 💡 **No Downloads Needed:** Test the app without downloading or installing anything!
            >
            > 🔗 **Permanent Link:** This link points to **version ${{ steps.get_version.outputs.VERSION }}** specifically and will always remain available.

            ---

