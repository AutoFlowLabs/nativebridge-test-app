name: Build and Upload to NativeBridge

# ============================================================================
# DEV REPOSITORY WORKFLOW
# ============================================================================
# Purpose: Build Android app and upload to NativeBridge
#
# This workflow is in the DEVELOPER repository (android-app-repo)
# It triggers the QA repository's workflow after successful upload
#
# Triggers:
# 1. Push to main/develop/staging (if commit has "nativebridge")
# 2. Manual workflow dispatch
#
# Outputs:
# - app_id: NativeBridge app ID
# - nb_version: NativeBridge version
# - magic_link: App installation link
#
# Next Step:
# - Triggers QA repository's test workflow (cross-repo trigger)
# ============================================================================

on:
  push:
    branches:
      - main
      - develop
      - staging

  workflow_dispatch:
    inputs:
      upload_to_nativebridge:
        description: 'Upload to NativeBridge?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      trigger_qa_tests:
        description: 'Trigger QA tests after upload?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      device_name:
        description: 'Device for QA tests'
        required: false
        default: ''
      region:
        description: 'Region (ind, usa, etc.)'
        required: false
        default: ''

# Permissions for cross-repo workflow triggering
permissions:
  contents: read
  actions: write

jobs:
  # ==========================================================================
  # Job 1: Check Upload Trigger
  # ==========================================================================
  check-trigger:
    name: Check Upload Trigger
    runs-on: ubuntu-latest
    outputs:
      should_upload: ${{ steps.check.outputs.should_upload }}
      trigger_reason: ${{ steps.check.outputs.trigger_reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if upload should happen
        id: check
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Build Pipeline - Upload Check                  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHOULD_UPLOAD="${{ github.event.inputs.upload_to_nativebridge }}"
            REASON="Manual trigger (upload: $SHOULD_UPLOAD)"
            echo "✓ Trigger: Manual workflow dispatch"
            echo "✓ Upload to NativeBridge: $SHOULD_UPLOAD"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "✓ Trigger: Push to ${{ github.ref_name }}"
            echo "✓ Commit: $COMMIT_MSG"

            if echo "$COMMIT_MSG" | grep -qi "nativebridge"; then
              SHOULD_UPLOAD="true"
              REASON="Push trigger (commit contains 'nativebridge')"
              echo "✓ Commit contains 'nativebridge' - will upload"
            else
              SHOULD_UPLOAD="false"
              REASON="Push trigger (no 'nativebridge' keyword)"
              echo "✓ No 'nativebridge' keyword - skip upload"
            fi
          fi

          echo ""
          echo "should_upload=$SHOULD_UPLOAD" >> $GITHUB_OUTPUT
          echo "trigger_reason=$REASON" >> $GITHUB_OUTPUT
          echo "Decision: SHOULD_UPLOAD=$SHOULD_UPLOAD"
          echo "Reason: $REASON"

  # ==========================================================================
  # Job 2: Build Application
  # ==========================================================================
  build-app:
    name: Build Application
    needs: [check-trigger]
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_size: ${{ steps.build.outputs.apk_size }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Build Info
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Building Android Application                    ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Upload: ${{ needs.check-trigger.outputs.should_upload }}"
          echo ""

      # ========================================================================
      # TODO: Add your Android build steps here
      # ========================================================================
      # Uncomment and customize these steps for real Android builds:
      #
      # - name: Set up JDK 17
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: '17'
      #
      # - name: Setup Android SDK
      #   uses: android-actions/setup-android@v3
      #
      # - name: Cache Gradle dependencies
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #     key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #
      # - name: Build APK
      #   run: |
      #     cd android
      #     chmod +x gradlew
      #     ./gradlew assembleRelease
      #
      # - name: Sign APK
      #   run: |
      #     # Add APK signing steps
      #     # Use secrets for keystore
      #
      # - name: Copy APK
      #   run: |
      #     mkdir -p builds/
      #     cp android/app/build/outputs/apk/release/app-release.apk \
      #        builds/NativeBridge-Production.apk
      # ========================================================================

      - name: Build (Using Pre-built APK)
        id: build
        run: |
          echo "📦 Using pre-built APK from builds/ folder"
          echo "   (Replace this with actual build steps in production)"
          echo ""

          if [ ! -f "builds/NativeBridge-Production.apk" ]; then
            echo "❌ ERROR: APK not found at builds/NativeBridge-Production.apk"
            echo ""
            echo "Please either:"
            echo "1. Add APK to builds/NativeBridge-Production.apk, OR"
            echo "2. Uncomment and configure Android build steps above"
            exit 1
          fi

          APK_PATH="builds/NativeBridge-Production.apk"
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

          echo "✓ APK ready: $APK_PATH ($APK_SIZE)"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30

  # ==========================================================================
  # Job 3: Upload to NativeBridge
  # ==========================================================================
  upload-to-nativebridge:
    name: Upload to NativeBridge
    needs: [check-trigger, build-app]
    if: needs.check-trigger.outputs.should_upload == 'true'
    runs-on: ubuntu-latest
    outputs:
      app_id: ${{ steps.upload.outputs.app_id }}
      nb_version: ${{ steps.upload.outputs.nb_version }}
      magic_link: ${{ steps.upload.outputs.magic_link }}
      upload_success: ${{ steps.upload.outputs.success }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: apk-to-upload

      - name: Upload to NativeBridge
        id: upload
        env:
          NATIVEBRIDGE_API_KEY: ${{ secrets.NATIVEBRIDGE_API_KEY }}
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Uploading to NativeBridge                       ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

          APK_PATH=$(find apk-to-upload -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK not found"
            exit 1
          fi

          if [ -z "$NATIVEBRIDGE_API_KEY" ]; then
            echo "❌ ERROR: NATIVEBRIDGE_API_KEY not configured"
            exit 1
          fi

          echo "📦 APK: $APK_PATH"
          echo "🔑 API Key: ${NATIVEBRIDGE_API_KEY:0:15}..."
          echo ""
          echo "Uploading..."

          RESPONSE=$(curl -X POST https://api.nativebridge.io/v1/application \
            -H "X-Api-Key: $NATIVEBRIDGE_API_KEY" \
            -F "file=@$APK_PATH" \
            -F "accessType=public" \
            -F "versionAction=create_new_version" \
            -F "sendNotification=true" \
            -w "\n%{http_code}" \
            -s)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ SUCCESS!"
            echo ""

            APP_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | sed 's/"id":"//;s/"//')
            NB_VERSION=$(echo "$BODY" | grep -o '"version":"[^"]*"' | sed 's/"version":"//;s/"//')
            MAGIC_LINK=$(echo "$BODY" | grep -o '"magicLink":"[^"]*"' | sed 's/"magicLink":"//;s/"//')

            if [ -z "$APP_ID" ]; then
              echo "❌ ERROR: Could not extract app_id"
              exit 1
            fi

            if [ -z "$NB_VERSION" ]; then
              echo "⚠️  WARNING: Could not extract nb_version, using 'latest'"
              NB_VERSION="latest"
            fi

            if [ -z "$MAGIC_LINK" ]; then
              MAGIC_LINK="N/A"
            fi

            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
            echo "nb_version=$NB_VERSION" >> $GITHUB_OUTPUT
            echo "magic_link=$MAGIC_LINK" >> $GITHUB_OUTPUT
            echo "success=true" >> $GITHUB_OUTPUT

            echo "✅ App ID: $APP_ID"
            echo "✅ Version: $NB_VERSION"
            echo "✅ Magic Link: $MAGIC_LINK"
          else
            echo "❌ Upload failed (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # ==========================================================================
  # Job 4: Trigger QA Repository
  # Cross-repository workflow trigger
  # ==========================================================================
  trigger-qa-repository:
    name: Trigger QA Repository
    needs: [check-trigger, upload-to-nativebridge]
    if: |
      needs.upload-to-nativebridge.outputs.upload_success == 'true' &&
      github.event.inputs.trigger_qa_tests != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger QA Repository Workflow
        env:
          QA_REPO_PAT: ${{ secrets.QA_REPO_PAT }}
          QA_REPO_OWNER: ${{ vars.QA_REPO_OWNER }}
          QA_REPO_NAME: ${{ vars.QA_REPO_NAME }}
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Triggering QA Repository                        ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

          # Get device and region (use input or variable defaults)
          DEVICE_NAME="${{ github.event.inputs.device_name }}"
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="${{ vars.DEFAULT_DEVICE }}"
          fi
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="Samsung Galaxy S22 Ultra"
          fi

          REGION="${{ github.event.inputs.region }}"
          if [ -z "$REGION" ]; then
            REGION="${{ vars.DEFAULT_REGION }}"
          fi
          if [ -z "$REGION" ]; then
            REGION="ind"
          fi

          echo "Target Repository: $QA_REPO_OWNER/$QA_REPO_NAME"
          echo "App ID: ${{ needs.upload-to-nativebridge.outputs.app_id }}"
          echo "NB Version: ${{ needs.upload-to-nativebridge.outputs.nb_version }}"
          echo "Device: $DEVICE_NAME"
          echo "Region: $REGION"
          echo ""

          # Trigger QA repository workflow
          RESPONSE=$(curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $QA_REPO_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$QA_REPO_OWNER/$QA_REPO_NAME/actions/workflows/qa-tests.yml/dispatches \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"app_id\": \"${{ needs.upload-to-nativebridge.outputs.app_id }}\",
                \"nb_version\": \"${{ needs.upload-to-nativebridge.outputs.nb_version }}\",
                \"device_name\": \"$DEVICE_NAME\",
                \"region\": \"$REGION\",
                \"triggered_by\": \"dev-repo\"
              }
            }" \
            -w "\n%{http_code}" \
            -s)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -eq 204 ]; then
            echo "✅ QA Repository workflow triggered successfully!"
            echo ""
            echo "View test results at:"
            echo "https://github.com/$QA_REPO_OWNER/$QA_REPO_NAME/actions"
          else
            echo "❌ Failed to trigger QA workflow (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### QA Tests Triggered ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "QA tests have been triggered in separate repository:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ vars.QA_REPO_OWNER }}/${{ vars.QA_REPO_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- App ID: \`${{ needs.upload-to-nativebridge.outputs.app_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- NB Version: \`${{ needs.upload-to-nativebridge.outputs.nb_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Device: ${{ github.event.inputs.device_name || vars.DEFAULT_DEVICE || 'Samsung Galaxy S22 Ultra' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${{ github.event.inputs.region || vars.DEFAULT_REGION || 'ind' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View QA Test Results →](https://github.com/${{ vars.QA_REPO_OWNER }}/${{ vars.QA_REPO_NAME }}/actions)" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 5: Final Summary
  # ==========================================================================
  summary:
    name: Pipeline Summary
    needs: [check-trigger, build-app, upload-to-nativebridge, trigger-qa-repository]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary
        run: |
          echo "### Build and Upload Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ needs.check-trigger.outputs.trigger_reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.upload-to-nativebridge.result }}" == "success" ]; then
            echo "### ✅ Upload Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **App ID:** \`${{ needs.upload-to-nativebridge.outputs.app_id }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** \`${{ needs.upload-to-nativebridge.outputs.nb_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Magic Link:** [${{ needs.upload-to-nativebridge.outputs.magic_link }}](${{ needs.upload-to-nativebridge.outputs.magic_link }})" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.upload-to-nativebridge.result }}" == "skipped" ]; then
            echo "### ⏭️ Upload Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Upload Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.trigger-qa-repository.result }}" == "success" ]; then
            echo "### ✅ QA Tests Triggered" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tests are running in QA repository: \`${{ vars.QA_REPO_OWNER }}/${{ vars.QA_REPO_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.trigger-qa-repository.result }}" == "skipped" ]; then
            echo "### ⏭️ QA Tests Not Triggered" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Failed to Trigger QA Tests" >> $GITHUB_STEP_SUMMARY
          fi
